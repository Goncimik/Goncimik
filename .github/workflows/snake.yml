name: Generate Snake with GOGO

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: snake-svg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate GOGO snake SVGs
        run: |
          python scripts/postprocess_snake.py --out out/gogo-snake.svg --label GOGO
          python scripts/postprocess_snake.py --out out/gogo-snake-dark.svg --label GOGO --dark
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

