
name: Generate Snake with GOGO

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: snake-svg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GOGO snake animation
        run: |
          python scripts/postprocess_snake.py --outdir out

      - name: Validate generated SVG files
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for name in ("gogo-snake.svg", "gogo-snake-dark.svg"):
              ET.parse("out/" + name)
              print(name, "OK")
          PY

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
